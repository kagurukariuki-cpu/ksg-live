<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KSG Live</title>
<style>
:root{
  --gold:#c9a227;
  --gold-hi:#e0b93a;
  --gold-dim:#8a6f1a;
  --green:#1a4d2e;
  --green-hi:#2a7043;
  --red:#bb0000;
  --black:#0f0f0f;
  --cream:#f5efe0;
  --bg:var(--black);
  --card:#171717;
  --border:#2a2a2a;
  --text:var(--cream);
  --muted:#8a8578;
  --btn-text:#0f0f0f
}
body.light{
  --bg:var(--cream);
  --card:#ffffff;
  --border:#e0d5b8;
  --text:#1a1a1a;
  --muted:#6b5f45;
  --btn-text:#fff
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font:16px system-ui,-apple-system,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;
  transition:background .2s,color .2s
}

/* Kenya flag stripe across the top */
.flagstripe{
  position:fixed;top:0;left:0;right:0;height:6px;z-index:150;
  background:linear-gradient(to right,
    #000 0%, #000 25%,
    #bb0000 25%, #bb0000 50%,
    #1a4d2e 50%, #1a4d2e 75%,
    #c9a227 75%, #c9a227 100%)
}

.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:36px 28px;max-width:460px;width:100%;
  text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);
  position:relative;overflow:hidden
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(to right,#000 0 25%,#bb0000 25% 50%,#1a4d2e 50% 75%,#c9a227 75% 100%)
}

.brand{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 26px}
.brand img{height:64px}
.brand .name{font-size:24px;font-weight:800;letter-spacing:2px}
.brand .name span{color:var(--gold)}

.sub{color:var(--muted);font-size:14px;margin:0 0 22px;letter-spacing:.3px}

.btn{
  width:100%;padding:18px 22px;font-size:17px;font-weight:700;
  border-radius:14px;border:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:inherit;transition:all .15s;letter-spacing:.5px
}
.btn+.btn{margin-top:12px}
.btn .ico{font-size:20px}

/* Presenter button — gold gradient */
.btn.primary{
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-hi) 100%);
  color:var(--btn-text);
  box-shadow:0 6px 18px rgba(201,162,39,.35)
}
.btn.primary:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 26px rgba(201,162,39,.5)
}
.btn.primary:active{transform:translateY(0)}
.btn.primary:disabled{opacity:.45;cursor:default;transform:none}

/* Viewer button — green gradient */
.btn.secondary{
  background:linear-gradient(135deg,var(--green) 0%,var(--green-hi) 100%);
  color:#fff;
  box-shadow:0 6px 18px rgba(26,77,46,.4)
}
.btn.secondary:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 26px rgba(26,77,46,.55)
}
.btn.secondary:disabled{opacity:.45;cursor:default;transform:none}

/* Exit — red */
.btn.danger{
  background:linear-gradient(135deg,#8a0000 0%,var(--red) 100%);
  color:#fff;box-shadow:0 6px 18px rgba(187,0,0,.4)
}
.btn.danger:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(187,0,0,.55)}

.screen{display:none}
.screen.show{display:flex;flex-direction:column;align-items:center}
#rolePicker.show{min-height:100vh;justify-content:center;width:100%}

#secBanner{
  position:fixed;top:6px;left:0;right:0;
  background:linear-gradient(90deg,#8a0000,#bb0000,#8a0000);
  color:#fff;font-size:13px;padding:8px 12px;text-align:center;
  z-index:200;display:none;font-weight:700;letter-spacing:.5px
}
#secBanner.show{display:block}

#themeToggle{
  position:fixed;top:18px;right:18px;z-index:100;font-size:18px;
  background:var(--card);border:1px solid var(--border);cursor:pointer;
  padding:10px 14px;border-radius:12px;color:var(--text);transition:all .15s
}
#themeToggle:hover{border-color:var(--gold);color:var(--gold)}

#stage{flex:1;position:relative;display:flex;overflow:hidden}
#rv{width:100%;height:100%;object-fit:contain;display:none}
#waiting{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:20px;z-index:5;background:var(--bg);
  flex-direction:column;gap:12px
}
#waiting.hidden{display:none}
#vstatus{
  position:absolute;bottom:14px;left:14px;font:13px ui-monospace,monospace;
  color:var(--text);background:rgba(0,0,0,.55);padding:6px 12px;border-radius:8px;z-index:20
}
#vctrl{
  position:absolute;top:14px;right:14px;z-index:30;display:flex;gap:8px;
  background:rgba(0,0,0,.65);padding:8px 12px;border-radius:12px;
  align-items:center;backdrop-filter:blur(8px)
}
#vctrl button{
  font-size:14px;padding:8px 14px;border:0;border-radius:8px;
  background:var(--gold);color:var(--btn-text);cursor:pointer;font-weight:700
}
#vctrl button:hover{background:var(--gold-hi)}
#vol{width:100px;accent-color:var(--gold)}
#exitBtn{
  position:absolute;top:14px;left:14px;z-index:30;font-size:13px;
  padding:8px 14px;background:var(--red);color:#fff;border:0;border-radius:8px;
  cursor:pointer;font-weight:700
}
#viewer{display:none;position:fixed;inset:0;background:var(--bg)}
#viewer.show{display:flex}
#sender{text-align:center;width:100%;max-width:640px}
#slog{margin-top:20px;font-family:ui-monospace,monospace;font-size:13px;color:var(--muted);line-height:1.6}
#sstats{margin-top:10px;font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);opacity:.7}
#smode{margin-top:14px;font-size:14px;color:var(--gold);font-weight:700;letter-spacing:.5px}
#ssources{margin-top:6px;font-size:13px;color:var(--muted)}
#sender video{display:none}
#preview{
  position:fixed;bottom:16px;right:16px;width:280px;background:#000;
  border:2px solid var(--gold);border-radius:12px;z-index:50;display:none;overflow:hidden
}
#pv{width:100%;display:block}
.linkbox{
  background:var(--bg);border:1px dashed var(--gold);border-radius:12px;
  padding:14px 16px;margin-top:22px;font-family:ui-monospace,monospace;
  font-size:12px;word-break:break-all;color:var(--muted);line-height:1.6
}
.linkbox span{color:var(--gold);font-weight:700}
#sclass{font-size:13px;color:var(--muted);margin-bottom:20px;letter-spacing:.5px}
</style>
</head>
<body>
<div class="flagstripe"></div>
<button id="themeToggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
<div id="secBanner">🔴 Your screen is being shared</div>

<div id="rolePicker" class="screen">
<div class="card">
<div class="brand">
<img src="logo.png" alt="KSG">
<div class="name">KSG <span>LIVE</span></div>
</div>
<p class="sub">Choose your role to continue</p>
<button class="btn primary" onclick="setRole('presenter')"><span class="ico">📺</span> I am Presenting</button>
<button class="btn secondary" onclick="setRole('viewer')"><span class="ico">👁️</span> I am Watching</button>
</div>
</div>

<div id="sender" class="screen">
<div class="brand">
<img src="logo.png" alt="KSG">
<div class="name">KSG <span>LIVE</span></div>
</div>
<div id="sclass"></div>
<button id="start" class="btn primary"><span class="ico">▶</span> Start Sharing</button>
<button id="muteBtn" class="btn secondary" disabled><span class="ico">🎤</span> Mute Mic</button>
<button id="exitBtn2" class="btn danger"><span class="ico">✕</span> Exit</button>
<div id="smode">Mode: idle</div>
<div id="ssources">Sources: —</div>
<div id="slog">Click Start Sharing. Pick Entire Screen. Tick "Share system audio".</div>
<div id="sstats"></div>
<div class="linkbox">📎 Share this with viewers<br><span id="shareLink"></span></div>
<video id="v" autoplay muted playsinline></video>
<div id="preview"><video id="pv" autoplay muted playsinline></video></div>
</div>

<div id="viewer">
<div id="stage">
<video id="rv" autoplay playsinline></video>
<div id="waiting"><div>⏳</div><div>Waiting for presenter...</div></div>
<div id="vstatus">Connecting...</div>
<button id="exitBtn">Exit</button>
<div id="vctrl">
<button id="fullBtn">⛶</button>
<button id="muteBtnV">🔊</button>
<input id="vol" type="range" min="0" max="100" value="100">
</div>
</div>
</div>

<script>
function toggleTheme(){
document.body.classList.toggle("light");
var isLight=document.body.classList.contains("light");
document.getElementById("themeToggle").textContent=isLight?"☀️":"🌙";
try{localStorage.setItem("ksg-theme",isLight?"light":"dark");}catch(e){}
}
(function(){
try{
if(localStorage.getItem("ksg-theme")==="light"){
document.body.classList.add("light");
document.getElementById("themeToggle").textContent="☀️";
}
}catch(e){}
})();

var params=new URLSearchParams(location.search);
var ROLE=params.get("role");
var ROOM=(params.get("room")||"class1").replace(/[^a-zA-Z0-9 _-]/g,"");
var el=function(id){return document.getElementById(id);};
var viewerId="v-"+Math.random().toString(36).slice(2,10);
var streaming=false,micMuted=false,sigSince=0;
var pc=null,peers={},ICE=[{urls:"stun:stun.l.google.com:19302"}];

function setRole(r){
var u=new URL(location.href);
u.searchParams.set("role",r);
u.searchParams.set("room",ROOM);
location.href=u.toString();
}
function show(e){e.classList.add("show");}
function hide(e){e.classList.remove("show");}

if(!ROLE){show(el("rolePicker"));}
else if(ROLE==="presenter"){
el("sclass").textContent="Room: "+ROOM;
show(el("sender"));
el("shareLink").textContent=location.origin+location.pathname+"?role=viewer&room="+encodeURIComponent(ROOM);
setupSender();
}else{
show(el("viewer"));
setupViewer();
}

function sigUrl(extra){return "signal.php?channel="+encodeURIComponent(ROOM)+(extra||"");}
function sigSend(obj){
fetch(sigUrl(""),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)}).catch(function(){});
}
function sigPoll(handler){
var backoff=300;
function tick(){
fetch(sigUrl("&since="+sigSince))
.then(function(r){return r.json();})
.then(function(arr){
if(Array.isArray(arr)){
for(var i=0;i<arr.length;i++){
sigSince=Math.max(sigSince,arr[i].id);
handler(arr[i].body);
}
}
backoff=300;
})
.catch(function(){backoff=Math.min(backoff*1.5,5000);})
.then(function(){setTimeout(tick,backoff);});
}
tick();
}

el("muteBtn").addEventListener("click",function(){
micMuted=!micMuted;
var s=el("v").srcObject;
if(s)s.getAudioTracks().forEach(function(t){t.enabled=!micMuted;});
el("muteBtn").innerHTML='<span class="ico">'+(micMuted?"🔇":"🎤")+'</span> '+(micMuted?"Unmute Mic":"Mute Mic");
});
el("exitBtn2").addEventListener("click",function(){location.href=location.pathname;});
el("exitBtn").addEventListener("click",function(){location.href=location.pathname;});

function setupSender(){
el("start").addEventListener("click",function(){
if(streaming)return;
var startBtn=el("start");
startBtn.disabled=true;

navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:true})
.then(function(display){
return navigator.mediaDevices.getUserMedia({audio:true})
.then(function(mic){return {display:display,mic:mic};})
.catch(function(){return {display:display,mic:null};});
})
.then(function(res){
var combined=new MediaStream();
res.display.getVideoTracks().forEach(function(t){combined.addTrack(t);});
res.display.getAudioTracks().forEach(function(t){combined.addTrack(t);});
if(res.mic)res.mic.getAudioTracks().forEach(function(t){combined.addTrack(t);});

el("v").srcObject=combined;
el("v").play();
el("pv").srcObject=combined;
el("preview").style.display="block";
el("secBanner").classList.add("show");
streaming=true;

var srcs="Sources: screen";
if(res.display.getAudioTracks().length)srcs+=" + system audio";
if(res.mic)srcs+=" + mic";
el("ssources").textContent=srcs;
el("muteBtn").disabled=!res.mic;
startBtn.innerHTML='<span class="ico">●</span> Sharing...';
el("slog").textContent="Sharing. Waiting for viewers.";
el("smode").textContent="Mode: WebRTC";

sigPoll(function(body){
if(!body)return;
if(body.type==="join"&&body.from&&!peers[body.from])newPeer(body.from,combined);
else if(body.type==="answer"&&body.from&&peers[body.from])peers[body.from].setRemoteDescription(body.data).catch(function(){});
else if(body.type==="vcandidate"&&body.from&&peers[body.from])peers[body.from].addIceCandidate(body.data).catch(function(){});
});

function newPeer(vid,stream){
var peer=new RTCPeerConnection({iceServers:ICE});
peers[vid]=peer;
el("sstats").textContent="Viewers: "+Object.keys(peers).length;
stream.getTracks().forEach(function(t){peer.addTrack(t,stream);});
peer.onicecandidate=function(e){if(e.candidate)sigSend({from:"sender",to:vid,type:"scandidate",data:e.candidate});};
peer.onconnectionstatechange=function(){
var st=peer.connectionState;
if(st==="failed"||st==="closed"||st==="disconnected"){
try{peer.close();}catch(e){}
delete peers[vid];
el("sstats").textContent="Viewers: "+Object.keys(peers).length;
}
};
peer.createOffer().then(function(offer){
return peer.setLocalDescription(offer).then(function(){
sigSend({from:"sender",to:vid,type:"offer",data:{type:offer.type,sdp:offer.sdp}});
});
});
}

res.display.getVideoTracks()[0].addEventListener("ended",function(){
streaming=false;
startBtn.disabled=false;
startBtn.innerHTML='<span class="ico">▶</span> Start Sharing';
el("preview").style.display="none";
el("secBanner").classList.remove("show");
el("smode").textContent="Mode: idle";
Object.keys(peers).forEach(function(id){try{peers[id].close();}catch(e){}delete peers[id];});
});
})
.catch(function(){el("slog").textContent="Cancelled.";startBtn.disabled=false;});
});
}

function setupViewer(){
var rv=el("rv");
var waiting=el("waiting");
var vstatus=el("vstatus");

el("fullBtn").addEventListener("click",function(){
if(!document.fullscreenElement)document.documentElement.requestFullscreen();
else document.exitFullscreen();
});
el("muteBtnV").addEventListener("click",function(){
rv.muted=!rv.muted;
el("muteBtnV").textContent=rv.muted?"🔇":"🔊";
});
el("vol").addEventListener("input",function(e){rv.volume=e.target.value/100;});

pc=new RTCPeerConnection({iceServers:ICE});
pc.ontrack=function(e){
rv.srcObject=e.streams[0];
rv.style.display="block";
waiting.classList.add("hidden");
vstatus.textContent="Live — "+ROOM;
};
pc.onicecandidate=function(e){if(e.candidate)sigSend({from:viewerId,to:"sender",type:"vcandidate",data:e.candidate});};
pc.onconnectionstatechange=function(){
var st=pc.connectionState;
if(st==="failed"||st==="disconnected"||st==="closed"){
rv.style.display="none";
waiting.classList.remove("hidden");
waiting.lastElementChild.textContent="Reconnecting...";
vstatus.textContent="Reconnecting...";
}
};

sigSend({from:viewerId,to:"sender",type:"join"});

sigPoll(function(body){
if(!body)return;
if(body.to!==viewerId&&body.to!=="*")return;
if(body.type==="offer"){
pc.setRemoteDescription(body.data)
.then(function(){return pc.createAnswer();})
.then(function(ans){return pc.setLocalDescription(ans).then(function(){
sigSend({from:viewerId,to:"sender",type:"answer",data:{type:ans.type,sdp:ans.sdp}});
});})
.catch(function(){});
}else if(body.type==="scandidate"){
pc.addIceCandidate(body.data).catch(function(){});
}
});
}
</script>
</body>
</html>
