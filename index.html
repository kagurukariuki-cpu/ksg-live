<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KSG Live</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#0f0f0f;color:#f5efe0;margin:0;min-height:100vh}
.stripe{position:fixed;top:0;left:0;right:0;height:6px;background:linear-gradient(to right,#000 0 25%,#bb0000 25% 50%,#1a4d2e 50% 75%,#c9a227 75% 100%);z-index:100}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:32px;max-width:460px;width:100%;text-align:center;box-sizing:border-box}
.logo{font-size:26px;font-weight:800;letter-spacing:2px;margin-bottom:24px}
.logo span{color:#c9a227}
.sub{color:#8a8578;font-size:14px;margin-bottom:20px}
.btn{display:block;width:100%;padding:18px;font-size:16px;font-weight:700;border:0;border-radius:12px;cursor:pointer;margin-top:12px;text-decoration:none;text-align:center;box-sizing:border-box;font-family:inherit}
.btn-gold{background:linear-gradient(135deg,#c9a227,#e0b93a);color:#0f0f0f}
.btn-green{background:linear-gradient(135deg,#1a4d2e,#2a7043);color:#fff}
.btn-red{background:linear-gradient(135deg,#8a0000,#bb0000);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
select,input{width:100%;padding:16px;font-size:16px;border:2px solid #2a2a2a;border-radius:12px;background:#0f0f0f;color:#f5efe0;font-family:inherit;margin-bottom:12px;box-sizing:border-box}
.hidden{display:none}
#rv{width:100vw;height:100vh;object-fit:contain;background:#000;display:block}
#viewer{position:fixed;top:0;left:0;right:0;bottom:0;background:#000}
#status{position:fixed;bottom:12px;left:12px;background:rgba(0,0,0,.8);padding:8px 14px;border-radius:8px;font:12px monospace;z-index:30;color:#fff;max-width:70vw;word-break:break-all}
#controls{position:fixed;top:12px;right:12px;display:flex;gap:8px;background:rgba(0,0,0,.75);padding:8px;border-radius:8px;z-index:10;align-items:center}
#controls button{padding:8px 14px;border:0;border-radius:6px;background:#c9a227;color:#0f0f0f;font-weight:700;cursor:pointer}
#controls input{width:90px;margin:0}
#exitBtn{position:fixed;top:12px;left:12px;background:#8a0000;color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;text-decoration:none;z-index:11}
#waiting{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:#000;color:#888;z-index:5;flex-direction:column;gap:12px;font-size:20px;padding:20px;text-align:center;pointer-events:none}
#waiting.gone{display:none}
#preview{position:fixed;bottom:16px;right:16px;width:240px;border:2px solid #c9a227;border-radius:8px;z-index:50;background:#000}
#preview video{width:100%;display:block}
.linkbox{background:#0f0f0f;border:1px dashed #c9a227;border-radius:8px;padding:12px;margin-top:20px;font:11px monospace;word-break:break-all;color:#8a8578}
.linkbox span{color:#c9a227;font-weight:700}
#senderInfo{margin-top:20px;font:12px monospace;color:#8a8578;line-height:1.6}
#viewerCount{margin-top:8px;font-size:14px;color:#c9a227;font-weight:700}
#noRooms{color:#8a8578;font-size:13px;padding:12px;text-align:center}
</style>
</head>
<body>
<div class="stripe"></div>

<div id="role" class="wrap hidden">
  <div class="card">
    <div class="logo">KSG <span>LIVE</span></div>
    <p class="sub">Choose your role</p>
    <a class="btn btn-gold" href="?role=presenter">I am Presenting</a>
    <a class="btn btn-green" href="?role=viewer">I am Watching</a>
  </div>
</div>

<div id="classStep" class="wrap hidden">
  <div class="card">
    <div class="logo">KSG <span>LIVE</span></div>
    <p class="sub" id="classSub">Choose class</p>
    <select id="roomSel"></select>
    <div id="noRooms" class="hidden">No live classes yet - type a name below</div>
    <input id="roomCustom" placeholder="Or type your own class name">
    <button class="btn btn-gold" onclick="enterRoom()">Enter</button>
    <a class="btn btn-red" href=".">Back</a>
  </div>
</div>

<div id="sender" class="wrap hidden">
  <div class="card">
    <div class="logo">KSG <span>LIVE</span></div>
    <div class="sub" id="roomLabel"></div>
    <button id="startBtn" class="btn btn-gold">Start Sharing</button>
    <button id="muteBtn" class="btn btn-green" disabled>Mute Mic</button>
    <a class="btn btn-red" href=".">Exit</a>
    <div id="senderInfo">Mode: idle</div>
    <div id="viewerCount">0 viewers connected</div>
    <div class="linkbox">Share with viewers:<br><span id="shareUrl"></span></div>
  </div>
  <div id="preview" class="hidden"><video id="pv" autoplay muted playsinline></video></div>
</div>

<div id="viewer" class="hidden">
  <video id="rv" autoplay playsinline muted></video>
  <div id="waiting"><div>Waiting for presenter...</div><div id="waitText"></div></div>
  <div id="status">Connecting...</div>
  <a id="exitBtn" href=".">Exit</a>
  <div id="controls">
    <button id="fsBtn">Fullscreen</button>
    <button id="spkBtn">Sound Off</button>
    <input id="vol" type="range" min="0" max="100" value="100">
  </div>
</div>

<script>
var params = new URLSearchParams(location.search);
var ROLE = params.get("role");
var ROOM = params.get("room") || "";
var viewerId = "v" + Math.random().toString(36).slice(2,10);

var ICE = [
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun.relay.metered.ca:80"},
  {urls:"turn:global.relay.metered.ca:80",username:"4d1ca704b0f914411fa1aa74",credential:"gaqQqC3Rzh3RAi0b"},
  {urls:"turn:global.relay.metered.ca:80?transport=tcp",username:"4d1ca704b0f914411fa1aa74",credential:"gaqQqC3Rzh3RAi0b"},
  {urls:"turn:global.relay.metered.ca:443",username:"4d1ca704b0f914411fa1aa74",credential:"gaqQqC3Rzh3RAi0b"},
  {urls:"turns:global.relay.metered.ca:443?transport=tcp",username:"4d1ca704b0f914411fa1aa74",credential:"gaqQqC3Rzh3RAi0b"}
];

var RTC_CFG = {
  iceServers: ICE,
  bundlePolicy: "max-bundle",
  rtcpMuxPolicy: "require"
};

var sigSince = 0;
var streaming = false;
var micMuted = false;
var pc = null;
var peers = {};
var senderPollStarted = false;
var senderCombined = null;
var heartbeatTimer = null;
var lastSigType = "-";

function $(id){ return document.getElementById(id); }

function enterRoom(){
  var custom = ($("roomCustom").value || "").replace(/[^a-zA-Z0-9 _-]/g,"").trim();
  var v = custom || $("roomSel").value;
  if (!v) return;
  location.href = location.pathname + "?role=" + encodeURIComponent(ROLE) + "&room=" + encodeURIComponent(v);
}

function loadRooms(){
  var sel = $("roomSel");
  fetch("rooms.php?t=" + Date.now())
  .then(function(r){ return r.json(); })
  .then(function(list){
    sel.innerHTML = "";
    if (Array.isArray(list) && list.length) {
      list.forEach(function(n){
        var o = document.createElement("option");
        o.value = n; o.textContent = n;
        sel.appendChild(o);
      });
      $("noRooms").classList.add("hidden");
    } else {
      $("noRooms").classList.remove("hidden");
    }
  })
  .catch(function(){ $("noRooms").classList.remove("hidden"); });
}

function announceLive(){
  if (!ROOM) return;
  fetch("signal.php?channel=_live_rooms", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({room: ROOM, t: Math.floor(Date.now()/1000)})
  }).catch(function(){});
}

function startHeartbeat(){
  announceLive();
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(function(){ if (streaming) announceLive(); }, 2000);
}

if (!ROLE) {
  $("role").classList.remove("hidden");
} else if (!ROOM) {
  $("classStep").classList.remove("hidden");
  $("classSub").textContent = ROLE === "presenter" ? "Which class are you presenting to?" : "Live classes - pick one";
  if (ROLE === "viewer") {
    loadRooms();
    setInterval(loadRooms, 2000);
  } else {
    var sel = $("roomSel");
    sel.innerHTML = "";
    ["Class 1","Class 2","Class 3"].forEach(function(n){
      var o = document.createElement("option");
      o.value = n; o.textContent = n;
      sel.appendChild(o);
    });
  }
} else if (ROLE === "presenter") {
  $("sender").classList.remove("hidden");
  $("roomLabel").textContent = "Room: " + ROOM;
  $("shareUrl").textContent = location.origin + location.pathname + "?role=viewer&room=" + encodeURIComponent(ROOM);
  setupSender();
} else {
  $("viewer").classList.remove("hidden");
  $("waitText").textContent = "Room: " + ROOM;
  setupViewer();
}

function sigUrl(extra){ return "signal.php?channel=" + encodeURIComponent(ROOM) + (extra || ""); }

function sigSend(obj){
  return fetch(sigUrl(""), {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(obj)
  }).catch(function(){});
}

function sigPoll(handler){
  var backoff = 300;
  function tick(){
    fetch(sigUrl("&since=" + sigSince))
    .then(function(r){ return r.json(); })
    .then(function(arr){
      if (Array.isArray(arr)) {
        for (var i = 0; i < arr.length; i++) {
          sigSince = Math.max(sigSince, arr[i].id);
          if (arr[i].body && arr[i].body.type) lastSigType = arr[i].body.type;
          try { handler(arr[i].body); } catch(e) {}
        }
      }
      backoff = 300;
    })
    .catch(function(){ backoff = Math.min(backoff * 1.5, 5000); })
    .then(function(){ setTimeout(tick, backoff); });
  }
  tick();
}

function updateViewerCount(){
  var n = 0;
  for (var k in peers) {
    if (peers.hasOwnProperty(k)) {
      var st = peers[k].pc.connectionState || peers[k].pc.iceConnectionState;
      if (st === "connected" || st === "connecting" || st === "checking" || st === "new") n++;
    }
  }
  $("viewerCount").textContent = n + " viewer" + (n === 1 ? "" : "s") + " connected";
}

/* ===================== SENDER ===================== */

function setupSender(){
  $("muteBtn").onclick = function(){
    micMuted = !micMuted;
    if (senderCombined) {
      senderCombined.getAudioTracks().forEach(function(t){ t.enabled = !micMuted; });
    }
    $("muteBtn").textContent = micMuted ? "Unmute Mic" : "Mute Mic";
  };

  $("startBtn").onclick = function(){
    if (streaming) return;
    $("startBtn").disabled = true;

    navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: { ideal: 30, max: 30 } },
      audio: true
    })
    .then(function(display){
      return navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true }
      })
      .then(function(mic){ return { display: display, mic: mic }; })
      .catch(function(){ return { display: display, mic: null }; });
    })
    .then(function(res){
      var combined = new MediaStream();
      res.display.getVideoTracks().forEach(function(t){ combined.addTrack(t); });
      if (res.mic && res.mic.getAudioTracks().length) {
        res.mic.getAudioTracks().forEach(function(t){ combined.addTrack(t); });
      } else if (res.display.getAudioTracks().length) {
        res.display.getAudioTracks().forEach(function(t){ combined.addTrack(t); });
      }
      senderCombined = combined;

      $("pv").srcObject = combined;
      $("pv").play().catch(function(){});
      $("preview").classList.remove("hidden");
      streaming = true;
      $("muteBtn").disabled = !res.mic;
      $("startBtn").textContent = "Sharing...";
      $("senderInfo").textContent =
        "Tracks: " + combined.getVideoTracks().length + " video, " +
        combined.getAudioTracks().length + " audio";

      updateViewerCount();
      startHeartbeat();

      if (!senderPollStarted) {
        senderPollStarted = true;
        sigPoll(handleSenderSignal);
      }

      res.display.getVideoTracks()[0].addEventListener("ended", stopSharing);
    })
    .catch(function(){ $("startBtn").disabled = false; });
  };

  // Housekeeping: kill peers that never connected and are older than 60s
  setInterval(function(){
    var now = Date.now();
    var changed = false;
    for (var vid in peers) {
      if (!peers.hasOwnProperty(vid)) continue;
      var e = peers[vid];
      var st = e.pc.connectionState || e.pc.iceConnectionState;
      var dead = (st === "failed" || st === "closed" || st === "disconnected");
      var tooOld = (!e.connected && now - e.startedAt > 60000);
      if (dead || tooOld) {
        try { e.pc.close(); } catch(ex){}
        delete peers[vid];
        changed = true;
      }
    }
    if (changed) updateViewerCount();
  }, 5000);
}

function stopSharing(){
  streaming = false;
  $("startBtn").disabled = false;
  $("startBtn").textContent = "Start Sharing";
  $("preview").classList.add("hidden");
  $("senderInfo").textContent = "Mode: idle";
  for (var id in peers) {
    if (peers.hasOwnProperty(id)) {
      try { peers[id].pc.close(); } catch(e){}
      delete peers[id];
    }
  }
  updateViewerCount();
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
  if (senderCombined) {
    senderCombined.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} });
  }
  senderCombined = null;
}

function handleSenderSignal(body){
  if (!body || !senderCombined || !streaming) return;

  if (body.type === "join" && body.from) {
    // Always (re)build the peer for this viewerId
    newPeer(body.from);

  } else if (body.type === "answer" && body.from && peers[body.from]) {
    var entry = peers[body.from];
    entry.pc.setRemoteDescription(new RTCSessionDescription(body.data))
    .then(function(){
      var q = entry.pending;
      entry.pending = [];
      q.forEach(function(c){
        entry.pc.addIceCandidate(new RTCIceCandidate(c)).catch(function(){});
      });
    })
    .catch(function(){});

  } else if (body.type === "vcandidate" && body.from && peers[body.from]) {
    var e2 = peers[body.from];
    var cand = new RTCIceCandidate(body.data);
    if (e2.pc.remoteDescription && e2.pc.remoteDescription.type) {
      e2.pc.addIceCandidate(cand).catch(function(){});
    } else {
      e2.pending.push(body.data);
    }
  }
}

function newPeer(vid){
  // Always tear down any existing peer for this viewer and start fresh.
  // This handles the case where the viewer reset its pc but kept the same id.
  var existing = peers[vid];
  if (existing) {
    try { existing.pc.close(); } catch(e){}
    delete peers[vid];
  }

  var peer = new RTCPeerConnection(RTC_CFG);
  var entry = { pc: peer, pending: [], startedAt: Date.now(), connected: false };
  peers[vid] = entry;
  updateViewerCount();

  senderCombined.getTracks().forEach(function(t){
    peer.addTrack(t, senderCombined);
  });

  peer.onicecandidate = function(e){
    if (e.candidate) {
      sigSend({
        from: "sender",
        to: vid,
        type: "scandidate",
        data: e.candidate.toJSON ? e.candidate.toJSON() : e.candidate
      });
    }
  };

  peer.onconnectionstatechange = function(){
    var s = peer.connectionState || peer.iceConnectionState;
    if (s === "connected" || s === "completed") {
      entry.connected = true;
      updateViewerCount();
    }
    if (s === "failed" || s === "closed") {
      try { peer.close(); } catch(e){}
      if (peers[vid] && peers[vid].pc === peer) {
        delete peers[vid];
        updateViewerCount();
      }
    }
  };

  peer.createOffer()
  .then(function(offer){
    return peer.setLocalDescription(offer).then(function(){
      sigSend({
        from: "sender",
        to: vid,
        type: "offer",
        data: { type: offer.type, sdp: offer.sdp }
      });
    });
  })
  .catch(function(){});
}

/* ===================== VIEWER ===================== */

function setupViewer(){
  var rv = $("rv");
  var muted = true;
  var gotVideo = false;
  var lastVideoTime = Date.now();
  var lastJoinSent = 0;
  var rebuilding = false;

  function hideWaiting(){ $("waiting").classList.add("gone"); }

  document.addEventListener("click", function(){
    if (muted) {
      rv.muted = false;
      muted = false;
      $("spkBtn").textContent = "Sound On";
    }
  });

  $("fsBtn").onclick = function(){
    if (rv.webkitEnterFullscreen) { rv.webkitEnterFullscreen(); return; }
    if (!document.fullscreenElement) {
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  };

  $("spkBtn").onclick = function(){
    muted = !muted;
    rv.muted = muted;
    $("spkBtn").textContent = muted ? "Sound Off" : "Sound On";
  };

  $("vol").oninput = function(e){ rv.volume = e.target.value / 100; };

  function attachHandlers(p){
    p.ontrack = function(e){
      if (e.streams && e.streams[0]) {
        rv.srcObject = e.streams[0];
        rv.play().catch(function(){});
        lastVideoTime = Date.now();
      }
    };
    p.onicecandidate = function(e){
      if (e.candidate) {
        sigSend({
          from: viewerId,
          to: "sender",
          type: "vcandidate",
          data: e.candidate.toJSON ? e.candidate.toJSON() : e.candidate
        });
      }
    };
    p.onconnectionstatechange = function(){
      var st = p.connectionState || p.iceConnectionState;
      if (st === "failed") {
        rebuildPeer();
      }
    };
  }

  function rebuildPeer(){
    if (rebuilding) return;
    rebuilding = true;
    try { if (pc) pc.close(); } catch(e){}
    pc = new RTCPeerConnection(RTC_CFG);
    attachHandlers(pc);
    $("waiting").classList.remove("gone");
    $("waitText").textContent = "Connecting...";
    sendJoin();
    setTimeout(function(){ rebuilding = false; }, 2000);
  }

  function sendJoin(){
    lastJoinSent = Date.now();
    sigSend({from:viewerId, to:"sender", type:"join"});
  }

  pc = new RTCPeerConnection(RTC_CFG);
  attachHandlers(pc);
  sendJoin();

  setInterval(function(){
    var v = $("rv");
    var vw = v.videoWidth || 0;
    var vh = v.videoHeight || 0;
    if (vw > 0 && vh > 0 && v.readyState >= 2) {
      gotVideo = true;
      hideWaiting();
      lastVideoTime = Date.now();
    }
    var st = (pc && (pc.connectionState || pc.iceConnectionState)) || "new";
    var ice = (pc && pc.iceConnectionState) || "new";
    $("status").textContent =
      "PC:" + st + " ICE:" + ice + " RS:" + v.readyState +
      " " + vw + "x" + vh + " sig:" + sigSince + " last:" + lastSigType;
  }, 500);

  // Watchdog: if stuck for 20s, rebuild pc — but keep SAME viewerId
  var stuckSince = 0;
  setInterval(function(){
    if (!pc) return;
    var st = pc.connectionState || pc.iceConnectionState;
    if (st === "new" || st === "checking" || st === "connecting" || st === "disconnected") {
      if (!stuckSince) stuckSince = Date.now();
      if (Date.now() - stuckSince > 20000) {
        stuckSince = 0;
        rebuildPeer();
      }
    } else {
      stuckSince = 0;
    }
  }, 2000);

  setInterval(function(){
    if (rv.paused && rv.srcObject) rv.play().catch(function(){});
  }, 1500);

  setInterval(function(){
    if (!gotVideo && Date.now() - lastVideoTime > 120000) location.reload();
  }, 5000);

  // Re-send join every 8s until we have video
  setInterval(function(){
    if (!gotVideo && Date.now() - lastJoinSent > 8000) sendJoin();
  }, 2000);

  sigPoll(function(body){
    if (!body) return;
    if (body.to && body.to !== viewerId && body.to !== "*") return;

    if (body.type === "offer") {
      var st = pc.connectionState || pc.iceConnectionState;
      var healthy = (st === "connected" || st === "completed" || st === "connecting" || st === "checking");
      if (pc.currentRemoteDescription && healthy) return;
      if (pc.currentRemoteDescription) {
        try { pc.close(); } catch(e){}
        pc = new RTCPeerConnection(RTC_CFG);
        attachHandlers(pc);
      }
      pc.setRemoteDescription(new RTCSessionDescription(body.data))
      .then(function(){ return pc.createAnswer(); })
      .then(function(ans){
        return pc.setLocalDescription(ans).then(function(){
          sigSend({
            from: viewerId,
            to: "sender",
            type: "answer",
            data: { type: ans.type, sdp: ans.sdp }
          });
        });
      })
      .catch(function(){});

    } else if (body.type === "scandidate") {
      if (pc && pc.remoteDescription && pc.remoteDescription.type) {
        pc.addIceCandidate(new RTCIceCandidate(body.data)).catch(function(){});
      }
    }
  });
}
</script>
</body>
</html>
