<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KSG Live</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px system-ui,-apple-system,sans-serif;background:#0f0f0f;color:#f5efe0;min-height:100vh}
.stripe{position:fixed;top:0;left:0;right:0;height:6px;z-index:100;background:linear-gradient(to right,#000 0 25%,#bb0000 25% 50%,#1a4d2e 50% 75%,#c9a227 75% 100%)}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:32px;max-width:460px;width:100%;text-align:center}
.logo{font-size:26px;font-weight:800;letter-spacing:2px;margin-bottom:24px}
.logo span{color:#c9a227}
.sub{color:#8a8578;font-size:14px;margin-bottom:20px}
.btn{width:100%;padding:18px;font-size:16px;font-weight:700;border:0;border-radius:12px;cursor:pointer;font-family:inherit;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-gold{background:linear-gradient(135deg,#c9a227,#e0b93a);color:#0f0f0f}
.btn-green{background:linear-gradient(135deg,#1a4d2e,#2a7043);color:#fff}
.btn-red{background:linear-gradient(135deg,#8a0000,#bb0000);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
select,input{width:100%;padding:16px;font-size:16px;border:2px solid #2a2a2a;border-radius:12px;background:#0f0f0f;color:#f5efe0;font-family:inherit;margin-bottom:12px}
select:focus,input:focus{outline:none;border-color:#c9a227}
.divider{color:#8a8578;font-size:13px;margin:16px 0}
.hidden{display:none !important}
#rv{display:block;width:100vw;height:100vh;object-fit:contain;background:#000}
#viewer{position:fixed;inset:0;background:#000}
#status{position:fixed;top:12px;left:12px;background:rgba(0,0,0,.75);padding:8px 14px;border-radius:8px;font:12px ui-monospace,monospace;z-index:10;color:#fff;max-width:80vw}
#controls{position:fixed;top:12px;right:12px;display:flex;gap:8px;background:rgba(0,0,0,.75);padding:8px;border-radius:8px;z-index:10;align-items:center}
#controls button{padding:8px 14px;border:0;border-radius:6px;background:#c9a227;color:#0f0f0f;font-weight:700;cursor:pointer}
#controls input{width:90px;margin:0;padding:0}
#exitBtn{position:fixed;top:12px;left:12px;background:#8a0000;color:#fff;border:0;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;z-index:11}
#waiting{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#888;z-index:5;flex-direction:column;gap:12px;padding:20px;text-align:center;font-size:clamp(16px,4vw,24px)}
#preview{position:fixed;bottom:16px;right:16px;width:240px;border:2px solid #c9a227;border-radius:8px;z-index:50;background:#000}
#preview video{width:100%;display:block}
#banner{position:fixed;top:6px;left:0;right:0;background:#bb0000;color:#fff;text-align:center;padding:8px;font-weight:700;z-index:99;font-size:13px;display:none}
.linkbox{background:#0f0f0f;border:1px dashed #c9a227;border-radius:8px;padding:12px;margin-top:20px;font:11px ui-monospace,monospace;word-break:break-all;color:#8a8578}
.linkbox span{color:#c9a227;font-weight:700}
#senderInfo{margin-top:20px;font:12px ui-monospace,monospace;color:#8a8578;line-height:1.6}
#viewerCount{margin-top:8px;font-size:14px;color:#c9a227;font-weight:700}
@media(max-width:700px){
  .card{padding:24px 20px;max-width:92vw}
  .btn{padding:22px;font-size:17px;margin-top:16px}
  .logo{font-size:22px}
  #controls{bottom:20px;top:auto;left:50%;transform:translateX(-50%);right:auto;padding:10px;gap:10px}
  #controls button{padding:14px 20px;font-size:16px}
  #vol{width:110px;height:28px}
  #exitBtn{top:auto;bottom:20px;left:12px;padding:14px 18px;font-size:15px}
  #status{font-size:11px;padding:6px 10px;max-width:60vw}
}
@media(min-width:1400px){
  .card{padding:44px 40px;max-width:560px}
  .logo{font-size:32px}
  .btn{padding:24px;font-size:18px}
}
*:focus-visible{outline:4px solid #c9a227;outline-offset:4px;border-radius:8px}
</style>
</head>
<body>
<div class="stripe"></div>
<div id="banner">🔴 Your screen is being shared</div>

<div id="role" class="wrap">
  <div class="card">
    <div class="logo">KSG <span>LIVE</span></div>
    <p class="sub">Choose your role</p>
    <button class="btn btn-gold" onclick="setRole('presenter')">📺 I am Presenting</button>
    <button class="btn btn-green" onclick="setRole('viewer')">👁 I am Watching</button>
  </div>
</div>

<div id="classStep" class="wrap hidden">
  <div class="card">
    <div class="logo">KSG <span>LIVE</span></div>
    <p class="sub" id="classSub">Choose class</p>
    <select id="roomSel"></select>
    <div class="divider">OR</div>
    <input id="roomCustom" placeholder="Type your own class name">
    <button class="btn btn-gold" onclick="enterRoom()">Enter</button>
    <button class="btn btn-red" onclick="backToRole()">Back</button>
  </div>
</div>

<div id="sender" class="wrap hidden">
  <div class="card">
    <div class="logo">KSG <span>LIVE</span></div>
    <div class="sub" id="roomLabel"></div>
    <button id="startBtn" class="btn btn-gold">▶ Start Sharing</button>
    <button id="muteBtn" class="btn btn-green" disabled>🎤 Mute Mic</button>
    <button class="btn btn-red" onclick="backToRole()">Exit</button>
    <div id="senderInfo">Mode: idle</div>
    <div id="viewerCount">👥 0 viewers connected</div>
    <div class="linkbox">Share this with viewers:<br><span id="shareUrl"></span></div>
  </div>
  <div id="preview" class="hidden"><video id="pv" autoplay muted playsinline></video></div>
</div>

<div id="viewer" class="hidden">
  <video id="rv" autoplay playsinline muted></video>
  <div id="waiting"><div>⏳</div><div id="waitText">Waiting for presenter...</div></div>
  <div id="status">Connecting...</div>
  <button id="exitBtn" onclick="backToRole()">Exit</button>
  <div id="controls">
    <button id="fsBtn">Fullscreen</button>
    <button id="spkBtn">🔇</button>
    <input id="vol" type="range" min="0" max="100" value="100">
  </div>
</div>

<script>
var params = new URLSearchParams(location.search);
var ROLE = params.get("role");
var ROOM = params.get("room") || "";
var viewerId = "v" + Math.random().toString(36).slice(2,10);
var ROOM_TAG = ROOM ? ROOM + "_" + Math.random().toString(36).slice(2,6) : "";

var ICE = [
  {urls:"stun:stun.relay.metered.ca:80"},
  {urls:"turn:global.relay.metered.ca:80",username:"4d1ca704b0f914411fa1aa74",credential:"gaqQqC3Rzh3RAi0b"},
  {urls:"turn:global.relay.metered.ca:80?transport=tcp",username:"4d1ca704b0f914411fa1aa74",credential:"gaqQqC3Rzh3RAi0b"},
  {urls:"turn:global.relay.metered.ca:443",username:"4d1ca704b0f914411fa1aa74",credential:"gaqQqC3Rzh3RAi0b"},
  {urls:"turns:global.relay.metered.ca:443?transport=tcp",username:"4d1ca704b0f914411fa1aa74",credential:"gaqQqC3Rzh3RAi0b"}
];

var $ = function(id){return document.getElementById(id);};
var sigSince = 0;
var streaming = false;
var micMuted = false;
var pc = null;
var peers = {};
var statusBase = "Mode: WebRTC";
var senderPollStarted = false;
var senderCombined = null;

if (!ROLE) {
  $("role").classList.remove("hidden");
} else if (!ROOM) {
  $("classStep").classList.remove("hidden");
  $("classSub").textContent = ROLE === "presenter" ? "Which class are you presenting to?" : "Which class are you watching?";
  loadRooms();
} else if (ROLE === "presenter") {
  $("sender").classList.remove("hidden");
  $("roomLabel").textContent = "Room: " + ROOM;
  $("shareUrl").textContent = location.origin + location.pathname + "?role=viewer&room=" + encodeURIComponent(ROOM);
  setupSender();
} else {
  $("viewer").classList.remove("hidden");
  $("waitText").textContent = "Waiting for presenter in " + ROOM + "...";
  setupViewer();
}

function setRole(r){
  var u = new URL(location.href);
  u.searchParams.set("role", r);
  u.searchParams.delete("room");
  location.href = u.toString();
}
function backToRole(){
  location.href = location.pathname;
}
function enterRoom(){
  var custom = ($("roomCustom").value || "").trim().replace(/[^a-zA-Z0-9 _-]/g,"");
  var v = custom || $("roomSel").value;
  if (!v) return;
  var u = new URL(location.href);
  u.searchParams.set("role", ROLE);
  u.searchParams.set("room", v);
  location.href = u.toString();
}
function loadRooms(){
  fetch("rooms.php").then(function(r){return r.json();}).then(function(list){
    var sel = $("roomSel");
    sel.innerHTML = "";
    if (!list || !list.length) list = ["Class 1","Class 2","Class 3"];
    list.forEach(function(n){
      var o = document.createElement("option");
      o.value = n; o.textContent = n;
      sel.appendChild(o);
    });
  }).catch(function(){
    var sel = $("roomSel");
    sel.innerHTML = "";
    ["Class 1","Class 2","Class 3"].forEach(function(n){
      var o = document.createElement("option");
      o.value = n; o.textContent = n;
      sel.appendChild(o);
    });
  });
}

function sigUrl(extra){ return "signal.php?channel=" + encodeURIComponent(ROOM) + (extra||""); }
function sigSend(obj){
  fetch(sigUrl(""), {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(obj)
  }).catch(function(){});
}
function sigPoll(handler){
  var backoff = 300;
  function tick(){
    fetch(sigUrl("&since=" + sigSince))
    .then(function(r){ return r.json(); })
    .then(function(arr){
      if (Array.isArray(arr)) {
        for (var i = 0; i < arr.length; i++) {
          sigSince = Math.max(sigSince, arr[i].id);
          handler(arr[i].body);
        }
      }
      backoff = 300;
    })
    .catch(function(){ backoff = Math.min(backoff * 1.5, 5000); })
    .then(function(){ setTimeout(tick, backoff); });
  }
  tick();
}

function updateViewerCount(){
  var n = Object.keys(peers).length;
  $("viewerCount").textContent = "👥 " + n + " viewer" + (n === 1 ? "" : "s") + " connected";
}

function setupSender(){
  $("muteBtn").addEventListener("click", function(){
    micMuted = !micMuted;
    if (senderCombined) {
      senderCombined.getAudioTracks().forEach(function(t){ t.enabled = !micMuted; });
    }
    $("muteBtn").textContent = micMuted ? "🔇 Unmute Mic" : "🎤 Mute Mic";
  });

  $("startBtn").addEventListener("click", function(){
    if (streaming) return;
    $("startBtn").disabled = true;

    navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true })
    .then(function(display){
      return navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(mic){ return { display: display, mic: mic }; })
      .catch(function(){ return { display: display, mic: null }; });
    })
    .then(function(res){
      var combined = new MediaStream();
      res.display.getVideoTracks().forEach(function(t){ combined.addTrack(t); });
      res.display.getAudioTracks().forEach(function(t){ combined.addTrack(t); });
      if (res.mic) res.mic.getAudioTracks().forEach(function(t){ combined.addTrack(t); });
      senderCombined = combined;

      $("pv").srcObject = combined;
      $("pv").play();
      $("preview").classList.remove("hidden");
      $("banner").style.display = "block";
      streaming = true;

      statusBase = "Mode: WebRTC | screen";
      if (res.display.getAudioTracks().length) statusBase += " + system";
      if (res.mic) statusBase += " + mic";
      $("senderInfo").textContent = statusBase;
      $("muteBtn").disabled = !res.mic;
      $("startBtn").textContent = "● Sharing...";
      updateViewerCount();

      if (!senderPollStarted) {
        senderPollStarted = true;
        sigPoll(function(body){
          if (!body) return;
          if (body.type === "join" && body.from && !peers[body.from] && senderCombined) {
            newPeer(body.from, senderCombined);
          } else if (body.type === "answer" && body.from && peers[body.from]) {
            peers[body.from].setRemoteDescription(body.data).catch(function(){});
          } else if (body.type === "vcandidate" && body.from && peers[body.from]) {
            peers[body.from].addIceCandidate(body.data).catch(function(){});
          }
        });
      }

      function newPeer(vid, stream){
        if (peers[vid]) return;
        var peer = new RTCPeerConnection({ iceServers: ICE });
        peers[vid] = peer;
        updateViewerCount();

        stream.getTracks().forEach(function(t){ peer.addTrack(t, stream); });

        peer.onicecandidate = function(e){
          if (e.candidate) sigSend({from:"sender", to:vid, type:"scandidate", data:e.candidate});
        };
        peer.onconnectionstatechange = function(){
          var st = peer.connectionState;
          if (st === "failed" || st === "closed" || st === "disconnected") {
            try { peer.close(); } catch(e) {}
            delete peers[vid];
            updateViewerCount();
          }
        };

        peer.createOffer().then(function(offer){
          return peer.setLocalDescription(offer).then(function(){
            sigSend({from:"sender", to:vid, type:"offer", data:{type:offer.type, sdp:offer.sdp}});
          });
        });
      }

      res.display.getVideoTracks()[0].addEventListener("ended", function(){
        streaming = false;
        $("startBtn").disabled = false;
        $("startBtn").textContent = "▶ Start Sharing";
        $("preview").classList.add("hidden");
        $("banner").style.display = "none";
        $("senderInfo").textContent = "Mode: idle";
        Object.keys(peers).forEach(function(id){ try{ peers[id].close(); }catch(e){} delete peers[id]; });
        updateViewerCount();
      });
    })
    .catch(function(){ $("startBtn").disabled = false; });
  });
}

function setupViewer(){
  var rv = $("rv");
  var muted = true;

  document.addEventListener("click", function(){
    if (muted) {
      rv.muted = false;
      muted = false;
      $("spkBtn").textContent = "🔊";
    }
  });

  $("fsBtn").addEventListener("click", function(){
    if (rv.webkitEnterFullscreen) { rv.webkitEnterFullscreen(); return; }
    if (!document.fullscreenElement) {
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  });

  $("spkBtn").addEventListener("click", function(){
    muted = !muted;
    rv.muted = muted;
    $("spkBtn").textContent = muted ? "🔇" : "🔊";
  });

  $("vol").addEventListener("input", function(e){
    rv.volume = e.target.value / 100;
  });

  pc = new RTCPeerConnection({ iceServers: ICE });

  pc.ontrack = function(e){
    rv.srcObject = e.streams[0];
    $("waiting").classList.add("hidden");
    rv.play().catch(function(){});
  };

  pc.onicecandidate = function(e){
    if (e.candidate) sigSend({from:viewerId, to:"sender", type:"vcandidate", data:e.candidate});
  };

  pc.onconnectionstatechange = function(){
    var st = pc.connectionState;
    if (st === "failed" || st === "disconnected" || st === "closed") {
      $("waiting").classList.remove("hidden");
      $("waitText").textContent = "Reconnecting...";
    }
  };

  setInterval(function(){
    var v = $("rv");
    $("status").textContent = "PC:" + pc.connectionState + " ICE:" + pc.iceConnectionState + " RS:" + v.readyState;
  }, 1500);

  sigSend({from:viewerId, to:"sender", type:"join"});

  sigPoll(function(body){
    if (!body) return;
    if (body.to !== viewerId && body.to !== "*") return;
    if (body.type === "offer") {
      pc.setRemoteDescription(body.data)
      .then(function(){ return pc.createAnswer(); })
      .then(function(ans){ return pc.setLocalDescription(ans).then(function(){
        sigSend({from:viewerId, to:"sender", type:"answer", data:{type:ans.type, sdp:ans.sdp}});
      }); })
      .catch(function(){});
    } else if (body.type === "scandidate") {
      pc.addIceCandidate(body.data).catch(function(){});
    }
  });
}
</script>
</body>
</html>
